name = "thavionai-feedback"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
GITHUB_REPO = "prashanthaitha24/thavionai-feedback"
ALLOWED_ORIGINS = "https://thavionai.com,https://www.thavionai.com,http://localhost:8765"
OPEN_ISSUE = "true"

# 5 submissions per IP per minute. Remove this block if the account plan rejects it.
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets are set with:  npx wrangler secret put GITHUB_TOKEN   /   npx wrangler secret put TURNSTILE_SECRET
