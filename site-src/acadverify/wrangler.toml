name = "acadverify"
main = "worker.js"
compatibility_date = "2024-11-01"

# The site origin allowed to call the issuer. Use "*" while testing locally.
[vars]
ALLOW_ORIGIN = "https://thavionai.com"

# Secrets are NOT set here — set them with `wrangler secret put` (see README.md):
#   EXAM_SECRET   any long random string (signs the stateless exam token)
#   SIGNING_KEY   the issuer ECDSA P-256 PRIVATE key as a JWK string
