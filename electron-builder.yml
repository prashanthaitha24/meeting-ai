appId: com.meeting-ai
productName: Meeting AI
copyright: Copyright © 2024

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

# ── macOS (Developer ID — direct DMG distribution) ───────────────────────────
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  hardenedRuntime: true
  # Notarize via notarytool using APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # (set in the build-mac CI job). Required so users don't see "unverified developer".
  notarize:
    teamId: K377RNF5LN
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLSchemes:
          - meetingai
        CFBundleURLName: com.meeting-ai
    NSMicrophoneUsageDescription: Meeting AI records your microphone to transcribe audio in real time. Audio is processed locally and never stored on our servers.
    NSScreenCaptureUsageDescription: Meeting AI captures your screen to analyze content when you press ⌘↵. Screenshots are sent to our AI backend and are not stored.

# ── macOS (Mac App Store) ─────────────────────────────────────────────────────
mas:
  category: public.app-category.productivity
  entitlements: resources/entitlements.mas.plist
  entitlementsInherit: resources/entitlements.mas.inherit.plist
  hardenedRuntime: false
  provisioningProfile: resources/MeetingAI.provisionprofile
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLSchemes:
          - meetingai
        CFBundleURLName: com.meeting-ai
    NSMicrophoneUsageDescription: Meeting AI records your microphone to transcribe audio in real time. Audio is processed locally and never stored on our servers.
    NSScreenCaptureUsageDescription: Meeting AI captures your screen to analyze content when you press ⌘↵. Screenshots are sent to our AI backend and are not stored.

dmg:
  title: Meeting AI
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 200
      type: file
    - x: 410
      y: 200
      type: link
      path: /Applications

# ── Windows (NSIS installer — direct distribution) ─────────────────────��─────
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  protocols:
    - name: Meeting AI
      schemes:
        - meetingai

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Meeting.AI-Setup-${version}-${arch}.exe
