name: Site tests

# Builds thavionai.com from source and runs the pytest invariants suite
# (Home link on every page, no broken internal links, no leaked placeholders,
# all lessons/projects/kits valid). Only runs when site files change, so it
# does not fire on desktop-app-only commits.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site-src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/site-tests.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'site-src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/site-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Build the site and run the invariants suite
        run: python -m pytest tests/ -q
