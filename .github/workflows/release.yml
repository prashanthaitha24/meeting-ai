name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  build-mac:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: echo "${{ secrets.DOTENV }}" > .env

      - name: Build & package macOS
        run: |
          # Unset CSC_LINK if empty — an empty string makes electron-builder
          # treat the working directory as the cert path and crash.
          [ -z "$CSC_LINK" ] && unset CSC_LINK || true
          npm run dist:mac -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Must be 'true' so electron-builder imports CSC_LINK and actually signs.
          # 'false' disables signing entirely (ignores the cert) — the bug that
          # shipped unsigned "damaged" DMGs in 1.0.5/1.0.6/1.0.7.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg

  build-mas:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: echo "${{ secrets.DOTENV }}" > .env

      - name: Write MAS provisioning profile
        run: |
          echo "${{ secrets.MAS_PROVISIONING_PROFILE }}" | base64 --decode > resources/MeetingAI.provisionprofile

      - name: Build & package Mac App Store
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK || true
          npm run dist:mas -- --publish never
        env:
          # App-signing cert: "Apple Distribution" / "3rd Party Mac Developer Application"
          CSC_LINK: ${{ secrets.MAS_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          # Installer-signing cert: "Mac Installer Distribution" — required to sign the .pkg
          CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_P12 }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_PASSWORD }}
          # Must be 'true' so electron-builder imports CSC_LINK and actually signs.
          # 'false' disables signing entirely (ignores the cert) — the bug that
          # shipped unsigned "damaged" DMGs in 1.0.5/1.0.6/1.0.7.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload MAS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mas-pkg
          path: dist/*.pkg

  build-win:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        shell: bash
        run: echo "${{ secrets.DOTENV }}" > .env

      - name: Build & package Windows
        run: npm run dist:win -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist/*.exe

  release:
    # NOTE: build-mas is intentionally NOT a dependency. The Mac App Store
    # .pkg is submitted via App Store Connect, not published to GitHub
    # Releases, and MAS signing failures must never block the DMG/EXE release.
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Meeting AI ${{ github.ref_name }}"
          files: |
            artifacts/mac-dmg/*.dmg
            artifacts/win-installer/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
